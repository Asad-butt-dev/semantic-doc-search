services:
     backend:
        build: 
            context: .
            dockerfile: dockerfile
        restart: unless-stopped
     frontend: 
         build: 
            context: ./frontend 
         depends_on:
           - backend 
         restart: unless-stopped
     caddy:
         image: caddy:alpine 
         ports:
           - "80:80"
           - "443:443"
         volumes:
            - ./Caddyfile:/etc/caddy/Caddyfile
            - caddy_data:/data
            - caddy_config:/config
volumes:
  caddy_data:
  caddy_config: